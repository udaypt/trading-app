# Use postgres/example user/password credentials

services:
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
      - ./data/db/trading.sql:/docker-entrypoint-initdb.d/trading.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8090:8080
    depends_on:
      - db

  backend:
    build: .
    restart: always
    ports:
      - 8080:8080
    environment:
      DB_CONNECTION_STRING: postgres://postgres:example@db:5432/trading_dashboard?sslmode=disable
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend/trading-app
      args:
        # CRA inlines this into the JS bundle at build time, so it must be a
        # URL the browser can reach, i.e. the backend's published host port
        # (not the "backend" in-network service name).
        REACT_APP_API_BASE_URL: http://localhost:8080
    restart: always
    ports:
      - 3000:80
    depends_on:
      - backend

volumes:
  pgdata:
